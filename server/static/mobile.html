<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sea of Colours</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0a0e16; --bg2:#141822; --bg3:#1c2230;
  --fg:#c8c0a8; --fg2:#8a8070;
  --frame:#2a3040; --frame2:#3a4555;
  --accent:#f4eedb;
  --cell:22px;
}
html,body{height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:"JetBrains Mono","Fira Mono","Courier New",monospace;}

/* ── Views ────────────────────────────────────────────────────────── */
.view{display:flex;flex-direction:column;height:100%;height:100dvh;}
.view[hidden]{display:none;}

/* ── Join ─────────────────────────────────────────────────────────── */
#view-join{align-items:center;justify-content:center;padding:24px;}
.join-card{width:100%;max-width:340px;border:1px solid var(--frame2);padding:28px 24px;
  display:flex;flex-direction:column;align-items:center;gap:16px;background:var(--bg2);}
.logo{font-size:10px;letter-spacing:0.18em;opacity:0.35;}
.seat-badge{font-size:17px;letter-spacing:0.1em;padding:10px 20px;border:2px solid var(--accent);
  color:var(--accent);text-align:center;width:100%;}
.session-id{font-size:10px;opacity:0.3;letter-spacing:0.06em;word-break:break-all;text-align:center;}
.error-msg{color:#ff5555;font-size:12px;text-align:center;}
.loading-msg{font-size:11px;opacity:0.4;letter-spacing:0.06em;}

/* ── Top strip ────────────────────────────────────────────────────── */
.top-strip{flex:0 0 auto;height:40px;display:flex;align-items:center;gap:8px;
  padding:0 10px;background:var(--bg2);border-bottom:1px solid var(--frame);
  font-size:11px;letter-spacing:0.05em;}
.phase-badge{padding:2px 7px;border:1px solid var(--accent);color:var(--accent);
  font-size:10px;letter-spacing:0.1em;flex:0 0 auto;}
.day-label{opacity:0.55;flex:0 0 auto;}
.pdots{display:flex;gap:4px;align-items:center;}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--frame2);}
.pdot.mine{background:var(--accent);}
.pdot.theirs{background:#f3c64a;}
.pdot.done{background:#3a4;}
.score-lbl{margin-left:auto;opacity:0.5;}

/* ── Map ──────────────────────────────────────────────────────────── */
.map-wrap{flex:1 1 0;min-height:0;overflow:hidden;touch-action:none;
  background:var(--bg);position:relative;cursor:grab;}
.map-wrap.panning{cursor:grabbing;}
.map-grid{display:grid;grid-template-columns:repeat(var(--cols,40),var(--cell));
  width:fit-content;user-select:none;line-height:var(--cell);
  transform-origin:0 0;will-change:transform;position:absolute;top:0;left:0;}
.mc{width:var(--cell);height:var(--cell);display:flex;align-items:center;
  justify-content:center;font-size:calc(var(--cell)*.72);position:relative;
  overflow:hidden;}
/* overlay symbol drawn over terrain */
.mc[data-ov]::before{content:attr(data-ov);position:absolute;
  top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:calc(var(--cell)*.9);pointer-events:none;z-index:3;
  color:var(--accent);text-shadow:0 0 5px var(--accent);}
/* unit dot */
.mc.has-unit::after{content:"";position:absolute;bottom:2px;right:2px;
  width:max(3px,calc(var(--cell)*.14));height:max(3px,calc(var(--cell)*.14));
  border-radius:50%;background:var(--accent);pointer-events:none;z-index:4;}
/* pick mode */
.map-grid.picking .mc.fog-cell{opacity:0.3;}
.map-grid.picking .mc:not(.fog-cell){outline:1px solid rgba(255,255,255,0.15);cursor:crosshair;}
/* selected overlay cell highlight */
.mc.ov-probe::before{color:#aaddff;}
.mc.ov-emp::before{color:#ffee00;}
.mc.ov-mine::before{color:#ff8844;}
.mc.ov-step::before{color:#88ff88;}

/* ── Utility bar ──────────────────────────────────────────────────── */
.util-bar{flex:0 0 auto;display:flex;align-items:center;gap:6px;
  padding:6px 10px;background:var(--bg2);border-top:1px solid var(--frame);}
.util-btn{flex:1;height:40px;border:1px solid var(--frame2);background:var(--bg);
  color:var(--fg);font-family:inherit;font-size:11px;letter-spacing:0.08em;cursor:pointer;}
.util-btn:active{background:rgba(255,255,255,0.06);}
.util-btn.active{border-color:var(--accent);color:var(--accent);}
.util-btn.cancel{border-color:#ff5555;color:#ff5555;}
.pick-hint{flex:1;font-size:10px;letter-spacing:0.08em;color:var(--accent);
  text-align:center;opacity:0.8;}
.recenter-btn{width:40px;height:40px;border:1px solid var(--frame2);background:var(--bg);
  color:var(--fg);font-family:inherit;font-size:16px;cursor:pointer;flex:0 0 auto;}
.recenter-btn:active{background:rgba(255,255,255,0.06);}
/* ── Queue row ────────────────────────────────────────────────────── */
.queue-row{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:5px;padding:5px 10px;
  min-height:0;max-height:96px;overflow-y:auto;background:var(--bg);}
.qchip{display:flex;align-items:center;gap:5px;padding:5px 10px;
  border:1px solid var(--frame2);font-size:10px;letter-spacing:0.05em;cursor:pointer;}
.qchip:active{border-color:#ff5555;}
.qchip .rm{color:#ff5555;font-size:12px;margin-left:2px;}

/* ── Transmit ─────────────────────────────────────────────────────── */
.transmit-btn{flex:0 0 auto;width:100%;height:54px;background:var(--accent);
  color:var(--bg);font-family:inherit;font-size:17px;letter-spacing:0.12em;
  border:none;cursor:pointer;font-weight:bold;
  padding-bottom:env(safe-area-inset-bottom,0);}
.transmit-btn:active{opacity:0.75;}
.transmit-btn:disabled{opacity:0.28;cursor:default;}

/* ── Context sheet ────────────────────────────────────────────────── */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:50;}
.sheet-backdrop[hidden]{display:none;}
#ctx-sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);
  border-top:1px solid var(--frame2);z-index:60;
  transform:translateY(100%);transition:transform 180ms ease-out;
  padding-bottom:env(safe-area-inset-bottom,0);}
#ctx-sheet.open{transform:translateY(0);}
.sheet-handle{width:34px;height:4px;background:var(--frame2);border-radius:2px;margin:9px auto 4px;}
.sheet-coord{font-size:10px;letter-spacing:0.12em;opacity:0.35;text-align:center;padding:2px 0 8px;
  border-bottom:1px solid var(--frame);}
.ctx-actions{display:flex;flex-direction:column;}
.ctx-tile{display:flex;align-items:center;gap:14px;padding:14px 18px;
  border-bottom:1px solid var(--frame);cursor:pointer;}
.ctx-tile:active{background:rgba(255,255,255,0.04);}
.ctx-tile:last-child{border-bottom:none;}
.ctx-icon{font-size:22px;width:30px;text-align:center;flex:0 0 auto;}
.ctx-label{font-size:13px;letter-spacing:0.06em;}
.ctx-desc{font-size:10px;opacity:0.38;margin-top:2px;}

/* ── Orbit tray ───────────────────────────────────────────────────── */
#tray-orbit{flex:1 1 0;min-height:0;display:flex;flex-direction:column;
  background:var(--bg2);border-top:1px solid var(--frame);overflow:hidden;}
.orbit-stats{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px;
  padding:10px 14px;border-bottom:1px solid var(--frame);background:var(--bg);}
.ostat{display:flex;gap:6px;align-items:baseline;
  padding:5px 10px;border:1px solid var(--frame2);font-size:11px;letter-spacing:0.05em;}
.ostat-n{color:var(--accent);font-size:13px;}
.orbit-slots-list{flex:1 1 0;overflow-y:auto;min-height:0;display:flex;flex-direction:column;}
.orbit-slot-row{flex:1;display:flex;align-items:center;gap:12px;padding:10px 14px;
  border-bottom:1px solid var(--frame);cursor:pointer;min-height:64px;}
.orbit-slot-row:active{background:rgba(255,255,255,0.04);}
.orbit-slot-n{font-size:9px;opacity:0.3;letter-spacing:0.1em;width:40px;flex:0 0 auto;}
.orbit-slot-val{font-size:12px;color:var(--accent);letter-spacing:0.06em;flex:1;}
.orbit-slot-empty{font-size:12px;opacity:0.2;}
.orbit-slot-change{font-size:10px;opacity:0.25;flex:0 0 auto;}

/* orbit picker sheet */
#orbit-sheet{position:fixed;left:0;right:0;bottom:0;max-height:70vh;overflow-y:auto;
  background:var(--bg2);border-top:1px solid var(--frame2);z-index:60;
  transform:translateY(100%);transition:transform 200ms ease-out;
  padding-bottom:env(safe-area-inset-bottom,0);}
#orbit-sheet.open{transform:translateY(0);}
.orbit-tile{display:flex;align-items:center;gap:14px;padding:14px 18px;
  border-bottom:1px solid var(--frame);cursor:pointer;}
.orbit-tile:active{background:rgba(255,255,255,0.04);}

/* ── Waiting ──────────────────────────────────────────────────────── */
#view-waiting{align-items:center;justify-content:center;padding:24px;}
.wait-card{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;}
.wait-tick{font-size:26px;color:var(--accent);}
.wait-lbl{font-size:13px;opacity:0.5;letter-spacing:0.06em;}
.ellipsis::after{content:"";animation:ell 1.4s steps(4,end) infinite;}
@keyframes ell{0%{content:"";}25%{content:".";}50%{content:"..";}75%{content:"...";}100%{content:"";}}

/* ── Report interstitial ──────────────────────────────────────────── */
.report-hdr{flex:0 0 auto;padding:18px 14px 12px;border-bottom:1px solid var(--frame);
  background:var(--bg2);}
.report-title{font-size:15px;letter-spacing:0.1em;color:var(--accent);margin-bottom:4px;}
.report-sub{font-size:10px;opacity:0.35;letter-spacing:0.08em;}
.report-list{flex:1 1 0;overflow-y:auto;padding:4px 0;}
.rentry{padding:11px 14px;border-bottom:1px solid var(--frame);font-size:12px;
  letter-spacing:0.04em;line-height:1.55;}
.rentry::before{content:"· ";color:var(--accent);}
.rentry.empty{opacity:0.35;font-style:italic;}
.rentry.empty::before{content:"";}
.log-btn{flex:0 0 auto;padding:5px 11px;border:1px solid var(--frame2);background:var(--bg);
  color:var(--fg2);font-family:inherit;font-size:10px;letter-spacing:0.08em;cursor:pointer;margin-left:auto;}
.log-btn:active{border-color:var(--accent);color:var(--accent);}
</style>
</head>
<body>

<!-- Join -->
<div id="view-join" class="view">
  <div class="join-card">
    <div class="logo">SEA OF COLOURS</div>
    <div id="join-badge" class="seat-badge">CONNECTING</div>
    <div id="join-sid" class="session-id"></div>
    <div id="join-err" class="error-msg" hidden></div>
    <button id="join-btn" class="transmit-btn" hidden style="margin-top:8px" onclick="joinGame()">READY ▶</button>
    <div id="join-load" class="loading-msg">connecting…</div>
  </div>
</div>

<!-- Game -->
<div id="view-game" class="view" hidden>
  <div class="top-strip">
    <span id="phase-badge" class="phase-badge">NOX</span>
    <span id="day-lbl" class="day-label">DAY 1</span>
    <div id="pdots" class="pdots"></div>
    <span id="score-lbl" class="score-lbl">0 pts</span>
  </div>
  <div class="map-wrap"><div id="map-grid" class="map-grid"></div></div>

  <!-- Night util bar -->
  <div id="util-night" class="util-bar">
    <button class="util-btn" id="btn-wait" onclick="doWait()">WAIT</button>
    <button class="util-btn" id="btn-chaff" onclick="doChaff()">CHAFF</button>
    <span id="pick-hint" class="pick-hint" hidden></span>
    <button class="util-btn cancel" id="btn-cancel" onclick="cancelPick()" hidden>✕ CANCEL</button>
    <button class="recenter-btn" onclick="recenter()" title="Centre on unit">⌖</button>
  </div>

  <!-- Queue + transmit (night) -->
  <div id="tray-night">
    <div id="queue-row" class="queue-row"></div>
    <button id="transmit-night" class="transmit-btn" onclick="transmitNight()">» TRANSMIT</button>
  </div>

  <!-- Orbit tray — fills screen, no map -->
  <div id="tray-orbit" hidden>
    <div id="orbit-stats" class="orbit-stats"></div>
    <div id="orbit-slots" class="orbit-slots-list"></div>
    <button id="transmit-orbit" class="transmit-btn" onclick="transmitOrbit()">» TRANSMIT ORBIT</button>
  </div>
</div>

<!-- Waiting -->
<div id="view-waiting" class="view" hidden>
  <div class="wait-card">
    <div id="wait-badge" class="seat-badge" style="width:220px"></div>
    <div class="wait-tick">TRANSMITTED ✓</div>
    <div id="wait-lbl" class="wait-lbl">Waiting<span class="ellipsis"></span></div>
  </div>
</div>

<!-- Report interstitial (night or orbit resolved) -->
<div id="view-report" class="view" hidden>
  <div class="report-hdr">
    <div id="report-title" class="report-title"></div>
    <div id="report-sub" class="report-sub"></div>
  </div>
  <div id="report-list" class="report-list"></div>
  <button class="transmit-btn" onclick="continueFromReport()">CONTINUE ›</button>
</div>

<!-- Context sheet (night cell actions) -->
<div id="ctx-bd" class="sheet-backdrop" hidden onclick="closeCtx()"></div>
<div id="ctx-sheet">
  <div class="sheet-handle"></div>
  <div id="ctx-coord" class="sheet-coord"></div>
  <div id="ctx-actions" class="ctx-actions"></div>
</div>

<!-- Orbit picker sheet -->
<div id="orb-bd" class="sheet-backdrop" hidden onclick="closeOrbSheet()"></div>
<div id="orbit-sheet">
  <div class="sheet-handle"></div>
  <div id="orb-sheet-title" class="sheet-coord"></div>
  <div id="orb-sheet-list" class="ctx-actions"></div>
</div>

<script>
// ── Constants ──────────────────────────────────────────────────────
const SEAT_COLOURS = {p1:"#f4eedb",p2:"#f3c64a",p3:"#ff5fd7",p4:"#5fd7ff"};
const SEAT_LABELS  = {p1:"WHITE",  p2:"YELLOW", p3:"MAGENTA",p4:"CYAN"};
const ZOOM_CELLS   = [16, 22, 28, 36];  // kept for reference only

const ORBIT_ACTIONS = [
  {id:"build_harvester",label:"BUILD HARVESTER",icon:"▲",desc:"Deploy a new harvester",wire:{a:"build_harvester"}},
  {id:"build_probe",    label:"BUILD PROBE",    icon:"◉",desc:"Stock a probe",         wire:{a:"build_probe"}},
  {id:"build_emp",      label:"BUILD EMP",      icon:"⚡",desc:"Arm an EMP missile",   wire:{a:"build_emp"}},
  {id:"build_mine",     label:"BUILD MINE",     icon:"◆",desc:"Arm a mine",            wire:{a:"build_mine"}},
  {id:"build_chaff",    label:"BUILD CHAFF",    icon:"~",desc:"Prep a chaff flare",    wire:{a:"build_chaff"}},
  {id:"refine_trace",   label:"REFINE TRACE",   icon:"⬡",desc:"Refine trace-tier ore", wire:{a:"refine",source_tier:"trace"}},
  {id:"refine_vein",    label:"REFINE VEIN",    icon:"⬡",desc:"Refine vein-tier ore",  wire:{a:"refine",source_tier:"vein"}},
  {id:"repair",         label:"REPAIR HARVESTER",icon:"✦",desc:"Restore a harvester", wire:null},
];

// ── State ──────────────────────────────────────────────────────────
const params    = new URLSearchParams(location.search);
const SESSION   = params.get("session") || "";
const MY_SEAT   = params.get("player")  || "p1";
const ACCENT    = SEAT_COLOURS[MY_SEAT] || "#f4eedb";
const SLABEL    = SEAT_LABELS[MY_SEAT]  || MY_SEAT.toUpperCase();

let viewData    = null;
let livePhase   = null;
let lastSig     = "";
let syncTimer   = null;

let nightQueue  = [];
let pendingPick = null;
let orbitSlots  = [null,null,null];
let activeSlot  = -1;
let reportLog   = [];
let reportTitle = "";
let reportSub   = "";

document.documentElement.style.setProperty("--accent", ACCENT);

// ── Utils ──────────────────────────────────────────────────────────
function setView(id) {
  ["view-join","view-game","view-waiting","view-report"].forEach(v =>
    document.getElementById(v).hidden = (v !== id));
}
function showErr(msg) {
  const e = document.getElementById("join-err");
  e.textContent = msg; e.hidden = !msg;
}
async function api(method, path, body) {
  const r = await fetch(path, {
    method, cache:"no-store",
    headers:{"Content-Type":"application/json"},
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) throw new Error(`${r.status}: ${await r.text().catch(()=>r.statusText)}`);
  return r.json();
}

function getCellEl(x, y) {
  return document.querySelector(`#map-grid .mc[data-x="${x}"][data-y="${y}"]`);
}
function getHarvester() {
  return (viewData?.units||[]).find(u => u.type === "harvester" && !u.orbit) || null;
}
function findCellOfUnit(uid) {
  const cells = viewData?.cells||[], w = viewData?.width||40;
  for (let i=0;i<cells.length;i++) {
    const occ = cells[i].occupants;
    if (Array.isArray(occ) && occ.some(o => (typeof o==="string"?o:o?.id||"")===uid))
      return {x: i%w, y: Math.floor(i/w)};
  }
  return null;
}
function cellAt(x, y) {
  const w = viewData?.width||40, cells = viewData?.cells||[];
  return cells[y*w+x] || null;
}

// ── Boot ───────────────────────────────────────────────────────────
(async function boot() {
  const badge = document.getElementById("join-badge");
  badge.textContent = `${MY_SEAT.toUpperCase()} · ${SLABEL}`;
  badge.style.borderColor = badge.style.color = ACCENT;
  document.getElementById("join-sid").textContent = SESSION ? `session: ${SESSION}` : "";
  if (!SESSION) { document.getElementById("join-load").hidden=true; showErr("No session ID — scan the QR again."); return; }
  try {
    const st = await api("GET",`/api/game/${SESSION}/status`);
    if (!(st.players||[]).includes(MY_SEAT)) { document.getElementById("join-load").hidden=true; showErr(`Seat ${MY_SEAT} not in this session.`); return; }
    const ag = st.agents||{};
    if (ag[MY_SEAT] && ag[MY_SEAT]!=="human") { document.getElementById("join-load").hidden=true; showErr(`${MY_SEAT} is an AI seat.`); return; }
    document.getElementById("join-load").hidden = true;
    livePhase = st.phase;
    if ((st.pending||{})[MY_SEAT]) { setView("view-waiting"); updateWait(st); startSync(); return; }
    document.getElementById("join-btn").hidden = false;
  } catch(e) { document.getElementById("join-load").hidden=true; showErr(`Connect failed: ${e.message}`); }
})();

async function joinGame() {
  const btn = document.getElementById("join-btn");
  btn.disabled=true; btn.textContent="Loading…";
  try { await pullView(); setView("view-game"); startSync(); }
  catch(e) { btn.disabled=false; btn.textContent="READY ▶"; showErr(`Load failed: ${e.message}`); }
}

// ── Map render ─────────────────────────────────────────────────────
function renderMap(data) {
  const grid = document.getElementById("map-grid");
  grid.style.setProperty("--cols", String(data.width));
  grid.innerHTML = "";
  const cells = data.cells||[], w = data.width;
  for (let i=0; i<cells.length; i++) {
    const c = cells[i], x=i%w, y=Math.floor(i/w);
    const el = document.createElement("div");
    el.className = "mc"; el.dataset.x=x; el.dataset.y=y;
    if (c.kind==="fog") {
      el.classList.add("fog-cell");
      el.style.cssText = "background:#111820;color:#252f40;";
      el.textContent = "░";
    } else {
      el.style.background = c.bg||"#141822";
      el.style.color = c.fg||"#666";
      el.textContent = c.ch||" ";
    }
    if ((c.occupants||[]).length || c.entity) el.classList.add("has-unit");
    grid.appendChild(el);
  }
  drawOverlays();
  initMapTransform();
}

// ── Cell tap ───────────────────────────────────────────────────────
function tapCell(x, y) {
  if (livePhase === "orbit") return;

  // Second tap: completing a step/drop pick
  if (pendingPick) {
    const move = pendingPick.type==="step"
      ? {a:"step", unit:pendingPick.unit, to:[x,y]}
      : {a:"drop", unit:pendingPick.unit, at:[x,y]};
    cancelPick();
    addMove(move);
    return;
  }

  // Build contextual actions for this cell
  const c = cellAt(x, y);
  const h = getHarvester();
  const hCell = h ? findCellOfUnit(h.id) : null;
  const onHarvester = hCell && hCell.x===x && hCell.y===y;

  const actions = [];
  if (onHarvester && h) {
    actions.push({icon:"▲",label:"STEP",desc:"Move harvester to another cell", fn:()=>{ closeCtx(); startPick("step",h.id,"STEP → pick destination"); }});
    actions.push({icon:"↑",label:"PICKUP",desc:"Pick up cargo on this cell",   fn:()=>{ closeCtx(); addMove({a:"pickup",unit:h.id}); }});
    actions.push({icon:"↓",label:"DROP",  desc:"Drop harvester from orbit here",fn:()=>{ closeCtx(); startPick("drop",h.id,"DROP → pick landing cell"); }});
  }
  actions.push({icon:"◉",label:"PROBE HERE",   cls:"ov-probe",desc:`Deploy probe to (${x},${y})`, fn:()=>{ closeCtx(); addMove({a:"probe",at:[x,y]}); }});
  actions.push({icon:"⚡",label:"EMP HERE",     cls:"ov-emp",  desc:`EMP strike at (${x},${y})`,  fn:()=>{ closeCtx(); addMove({a:"emp_launch",at:[x,y]}); }});
  actions.push({icon:"◆",label:"MINE HERE",    cls:"ov-mine", desc:`Lay mine at (${x},${y})`,     fn:()=>{ closeCtx(); addMove({a:"mine_lay",at:[x,y]}); }});

  openCtx(x, y, actions);
}

// ── Pick mode ──────────────────────────────────────────────────────
function startPick(type, unitId, hint) {
  pendingPick = {type, unit:unitId};
  document.getElementById("pick-hint").textContent = hint;
  document.getElementById("pick-hint").hidden = false;
  document.getElementById("btn-wait").hidden = true;
  document.getElementById("btn-chaff").hidden = true;
  document.getElementById("btn-cancel").hidden = false;
  document.getElementById("map-grid").classList.add("picking");
}
function cancelPick() {
  pendingPick = null;
  document.getElementById("pick-hint").hidden = true;
  document.getElementById("btn-cancel").hidden = true;
  document.getElementById("btn-wait").hidden = false;
  document.getElementById("btn-chaff").hidden = false;
  document.getElementById("map-grid").classList.remove("picking");
}

// ── Global night actions ───────────────────────────────────────────
function doWait()  { addMove({a:"wait"}); }
function doChaff() { addMove({a:"chaff_flare"}); }

// ── Queue management ───────────────────────────────────────────────
function addMove(move) {
  nightQueue.push(move);
  renderQueue();
  drawOverlays();
}
function removeMove(i) {
  nightQueue.splice(i,1);
  renderQueue();
  drawOverlays();
}

function moveLabel(m) {
  switch(m.a) {
    case "probe":       return `◉ PROBE (${m.at})`;
    case "emp_launch":  return `⚡ EMP (${m.at})`;
    case "mine_lay":    return `◆ MINE (${m.at})`;
    case "step":        return `▲ STEP→(${m.to})`;
    case "drop":        return `↓ DROP (${m.at})`;
    case "pickup":      return `↑ PICKUP`;
    case "wait":        return `◌ WAIT`;
    case "chaff_flare": return `~ CHAFF`;
    default:            return m.a;
  }
}

function renderQueue() {
  const row = document.getElementById("queue-row");
  row.innerHTML = "";
  nightQueue.forEach((m, i) => {
    const chip = document.createElement("div");
    chip.className = "qchip";
    chip.innerHTML = `<span>${moveLabel(m)}</span><span class="rm">✕</span>`;
    chip.onclick = () => removeMove(i);
    row.appendChild(chip);
  });
}

function drawOverlays() {
  // Clear all
  document.querySelectorAll(".mc[data-ov]").forEach(el => {
    el.removeAttribute("data-ov");
    el.classList.remove("ov-probe","ov-emp","ov-mine","ov-step","ov-drop");
  });
  for (const m of nightQueue) {
    let coords=null, sym="", cls="";
    if      (m.a==="probe")      {coords=m.at;sym="◉";cls="ov-probe";}
    else if (m.a==="emp_launch") {coords=m.at;sym="⚡";cls="ov-emp";}
    else if (m.a==="mine_lay")   {coords=m.at;sym="◆";cls="ov-mine";}
    else if (m.a==="step")       {coords=m.to;sym="▲";cls="ov-step";}
    else if (m.a==="drop")       {coords=m.at;sym="↓";cls="ov-drop";}
    if (coords) {
      const el = getCellEl(coords[0], coords[1]);
      if (el) { el.dataset.ov=sym; el.classList.add(cls); }
    }
  }
}

// ── Context sheet ──────────────────────────────────────────────────
function openCtx(x, y, actions) {
  document.getElementById("ctx-coord").textContent = `CELL (${x}, ${y})`;
  const list = document.getElementById("ctx-actions");
  list.innerHTML = "";
  for (const act of actions) {
    const tile = document.createElement("div");
    tile.className = "ctx-tile";
    tile.innerHTML = `<span class="ctx-icon">${act.icon}</span><div><div class="ctx-label">${act.label}</div><div class="ctx-desc">${act.desc}</div></div>`;
    tile.onclick = act.fn;
    list.appendChild(tile);
  }
  document.getElementById("ctx-bd").hidden = false;
  document.getElementById("ctx-sheet").classList.add("open");
}
function closeCtx() {
  document.getElementById("ctx-bd").hidden = true;
  document.getElementById("ctx-sheet").classList.remove("open");
}

// ── Map pan / pinch / inertia ──────────────────────────────────────
const CELL_PX = 22;   // base cell size in px (--cell fixed at this)
let mapX = 0, mapY = 0, mapScale = 1;
let mapW = 0, mapH = 0;  // grid pixel dimensions at scale=1

// touch tracking
let _t1 = null, _t2 = null;           // active touch points {id,x,y,x0,y0,t0}
let _panOrigin = null;                 // {mapX,mapY} at touch start
let _pinchOrigin = null;               // {dist,scale,midX,midY,mapX,mapY}
let _vx = 0, _vy = 0;                  // inertia velocity px/ms
let _lastMoveT = 0, _lastDX = 0, _lastDY = 0;
let _rafId = null;

function _applyTransform() {
  const grid = document.getElementById("map-grid");
  if (grid) grid.style.transform = `translate(${mapX}px,${mapY}px) scale(${mapScale})`;
}

function _clampMap() {
  const wrap = document.querySelector(".map-wrap");
  if (!wrap || !mapW) return;
  const ww = wrap.clientWidth, wh = wrap.clientHeight;
  const scaledW = mapW * mapScale, scaledH = mapH * mapScale;
  // allow panning up to half the screen past the edge (loose clamping)
  const margin = 60;
  mapX = Math.min(ww - margin, Math.max(margin - scaledW, mapX));
  mapY = Math.min(wh - margin, Math.max(margin - scaledH, mapY));
}

function _cellFromScreen(px, py) {
  const wrap = document.querySelector(".map-wrap");
  if (!wrap || !viewData) return null;
  const rect = wrap.getBoundingClientRect();
  const lx = (px - rect.left - mapX) / mapScale;
  const ly = (py - rect.top  - mapY) / mapScale;
  const cx = Math.floor(lx / CELL_PX);
  const cy = Math.floor(ly / CELL_PX);
  if (cx >= 0 && cy >= 0 && cx < viewData.width && cy < viewData.height) return {x:cx, y:cy};
  return null;
}

function initMapTransform() {
  const wrap = document.querySelector(".map-wrap");
  const grid = document.getElementById("map-grid");
  if (!wrap || !grid || !viewData) return;
  mapW = viewData.width  * CELL_PX;
  mapH = viewData.height * CELL_PX;
  const ww = wrap.clientWidth, wh = wrap.clientHeight;
  // fit whole map in view with a little padding
  mapScale = Math.min((ww - 8) / mapW, (wh - 8) / mapH);
  mapScale = Math.max(0.2, Math.min(4, mapScale));
  // centre the map
  mapX = (ww - mapW * mapScale) / 2;
  mapY = (wh - mapH * mapScale) / 2;
  _applyTransform();
  // attach touch handlers once
  if (!wrap._mapHandlersAttached) {
    wrap._mapHandlersAttached = true;
    wrap.addEventListener("touchstart",  _onTouchStart,  {passive:false});
    wrap.addEventListener("touchmove",   _onTouchMove,   {passive:false});
    wrap.addEventListener("touchend",    _onTouchEnd,    {passive:false});
    wrap.addEventListener("touchcancel", _onTouchCancel, {passive:false});
  }
}

function recenter() {
  const h = getHarvester();
  if (!h || !h.pos) { _fitMap(); return; }
  const wrap = document.querySelector(".map-wrap");
  if (!wrap) return;
  // keep current scale, scroll so harvester is centred
  const hpx = h.pos[0] * CELL_PX + CELL_PX / 2;
  const hpy = h.pos[1] * CELL_PX + CELL_PX / 2;
  mapX = wrap.clientWidth  / 2 - hpx * mapScale;
  mapY = wrap.clientHeight / 2 - hpy * mapScale;
  _clampMap();
  _applyTransform();
}

function _fitMap() {
  const wrap = document.querySelector(".map-wrap");
  if (!wrap || !mapW) return;
  mapScale = Math.min((wrap.clientWidth - 8) / mapW, (wrap.clientHeight - 8) / mapH);
  mapX = (wrap.clientWidth  - mapW * mapScale) / 2;
  mapY = (wrap.clientHeight - mapH * mapScale) / 2;
  _applyTransform();
}

function _dist(a, b) { return Math.hypot(a.x-b.x, a.y-b.y); }

function _onTouchStart(e) {
  e.preventDefault();
  _stopInertia();
  const touches = e.changedTouches;
  for (const t of touches) {
    const pt = {id:t.identifier, x:t.clientX, y:t.clientY, x0:t.clientX, y0:t.clientY, t0:Date.now()};
    if (!_t1) { _t1 = pt; }
    else if (!_t2) { _t2 = pt; }
  }
  if (_t1 && !_t2) {
    _panOrigin = {mapX, mapY, cx:_t1.x, cy:_t1.y};
    _pinchOrigin = null;
    document.querySelector(".map-wrap").classList.add("panning");
  } else if (_t1 && _t2) {
    _panOrigin = null;
    _pinchOrigin = {
      dist: _dist(_t1, _t2),
      scale: mapScale,
      midX: (_t1.x + _t2.x) / 2,
      midY: (_t1.y + _t2.y) / 2,
      mapX, mapY,
    };
  }
  _vx = 0; _vy = 0;
}

function _onTouchMove(e) {
  e.preventDefault();
  const now = Date.now();
  for (const t of e.changedTouches) {
    if (_t1 && t.identifier === _t1.id) { _t1.x = t.clientX; _t1.y = t.clientY; }
    if (_t2 && t.identifier === _t2.id) { _t2.x = t.clientX; _t2.y = t.clientY; }
  }
  if (_t1 && _t2 && _pinchOrigin) {
    const newDist = _dist(_t1, _t2);
    const newScale = Math.max(0.15, Math.min(5, _pinchOrigin.scale * (newDist / _pinchOrigin.dist)));
    const midX = (_t1.x + _t2.x) / 2;
    const midY = (_t1.y + _t2.y) / 2;
    const wrap = document.querySelector(".map-wrap");
    const rect = wrap.getBoundingClientRect();
    // zoom around midpoint
    const originX = midX - rect.left;
    const originY = midY - rect.top;
    mapX = originX - (originX - _pinchOrigin.mapX) * (newScale / _pinchOrigin.scale);
    mapY = originY - (originY - _pinchOrigin.mapY) * (newScale / _pinchOrigin.scale);
    mapScale = newScale;
    _clampMap();
    _applyTransform();
  } else if (_t1 && _panOrigin) {
    const dx = _t1.x - _panOrigin.cx;
    const dy = _t1.y - _panOrigin.cy;
    mapX = _panOrigin.mapX + dx;
    mapY = _panOrigin.mapY + dy;
    _clampMap();
    _applyTransform();
    // track velocity for inertia
    const dt = now - _lastMoveT;
    if (dt > 0 && dt < 100) { _vx = (_t1.x - _lastDX) / dt; _vy = (_t1.y - _lastDY) / dt; }
    _lastMoveT = now; _lastDX = _t1.x; _lastDY = _t1.y;
  }
}

function _onTouchEnd(e) {
  e.preventDefault();
  const now = Date.now();
  for (const t of e.changedTouches) {
    let released = null;
    if (_t1 && t.identifier === _t1.id) { released = _t1; _t1 = _t2; _t2 = null; }
    else if (_t2 && t.identifier === _t2.id) { released = _t2; _t2 = null; }

    if (released) {
      const dx = Math.abs(released.x - released.x0);
      const dy = Math.abs(released.y - released.y0);
      const dt = now - released.t0;
      // tap: short duration, barely moved, no second finger
      if (dt < 250 && dx < 9 && dy < 9 && !_t2 && livePhase !== "orbit") {
        const cell = _cellFromScreen(released.x0, released.y0);
        if (cell) tapCell(cell.x, cell.y);
        _vx = 0; _vy = 0;
        _t1 = _t2 = null;
        document.querySelector(".map-wrap").classList.remove("panning");
        return;
      }
    }
  }
  if (!_t1 && !_t2) {
    document.querySelector(".map-wrap").classList.remove("panning");
    _pinchOrigin = null; _panOrigin = null;
    // start inertia if flicking
    if (Math.hypot(_vx, _vy) > 0.1) _startInertia();
  } else if (_t1 && !_t2) {
    // dropped to one finger — restart pan from current position
    _pinchOrigin = null;
    _panOrigin = {mapX, mapY, cx:_t1.x, cy:_t1.y};
  }
}

function _onTouchCancel() {
  _t1 = _t2 = null; _panOrigin = null; _pinchOrigin = null;
  document.querySelector(".map-wrap").classList.remove("panning");
  _stopInertia();
}

function _startInertia() {
  let last = performance.now();
  function step(now) {
    const dt = Math.min(now - last, 32);
    last = now;
    const decay = Math.pow(0.92, dt / 16);
    _vx *= decay; _vy *= decay;
    mapX += _vx * dt; mapY += _vy * dt;
    _clampMap();
    _applyTransform();
    if (Math.hypot(_vx, _vy) > 0.02) { _rafId = requestAnimationFrame(step); }
    else { _rafId = null; }
  }
  _rafId = requestAnimationFrame(step);
}

function _stopInertia() {
  if (_rafId) { cancelAnimationFrame(_rafId); _rafId = null; }
}

// ── Transmit night ─────────────────────────────────────────────────
async function transmitNight() {
  const btn = document.getElementById("transmit-night");
  btn.disabled = true;
  const moves = nightQueue.length ? nightQueue : [{a:"wait"}];
  try {
    const r = await api("POST",`/api/game/${SESSION}/policy`,{player:MY_SEAT,moves});
    if (!r.ok) { alert(`Rejected: ${(r.errors||[]).join("; ")||"unknown"}`); btn.disabled=false; return; }
    nightQueue=[]; renderQueue(); drawOverlays(); cancelPick();
    setView("view-waiting");
    updateWaitFromResp(r.phase, r.pending||{});
    startSync();
  } catch(e) { alert(`Transmit failed: ${e.message}`); btn.disabled=false; }
}

// ── Report interstitial ────────────────────────────────────────────
function showReport(title, sub, entries) {
  reportTitle = title; reportSub = sub; reportLog = entries;
  document.getElementById("report-title").textContent = title;
  document.getElementById("report-sub").textContent   = sub;
  const list = document.getElementById("report-list");
  if (!entries.length) {
    list.innerHTML = `<div class="rentry empty">No events to show</div>`;
  } else {
    list.innerHTML = entries.map(e => {
      const text = typeof e === "string" ? e : e.msg || e.text || e.event || JSON.stringify(e);
      return `<div class="rentry">${text}</div>`;
    }).join("");
  }
  setView("view-report");
}
function continueFromReport() { setView("view-game"); }

// ── Orbit ──────────────────────────────────────────────────────────
function renderOrbitStats() {
  const el = document.getElementById("orbit-stats");
  if (!el || !viewData) return;
  const ob = viewData.agent_view?.orbit_block || {};
  const tc  = ob.tier_counts || {};
  const stats = [];
  const ps = ob.probe_stock ?? "?";
  stats.push(["PROBES", ps]);
  const creds = ob.credits ?? null;
  if (creds != null) stats.push(["CREDITS", creds]);
  if (tc.trace != null) stats.push(["TRACE", tc.trace]);
  if (tc.vein  != null) stats.push(["VEIN",  tc.vein]);
  if (tc.mass  != null) stats.push(["MASS",  tc.mass]);
  if (tc.pure  != null) stats.push(["PURE",  tc.pure]);
  const capMax = ob.harvester_cap_max ?? 0;
  if (capMax) stats.push(["CRAFT", `${ob.harvester_cap_used ?? 0}/${capMax}`]);
  el.innerHTML = stats.map(([k,v]) =>
    `<div class="ostat"><span>${k}</span><span class="ostat-n">${v}</span></div>`
  ).join("");
  if (reportLog.length) {
    el.innerHTML += `<button class="log-btn" onclick="showReport(reportTitle,reportSub,reportLog)">LAST NOX LOG ›</button>`;
  }
}

function renderOrbitSlots() {
  renderOrbitStats();
  const wrap = document.getElementById("orbit-slots-list");
  wrap.innerHTML = "";
  orbitSlots.forEach((sl, i) => {
    const row = document.createElement("div");
    row.className = "orbit-slot-row";
    const act = sl ? ORBIT_ACTIONS.find(a=>a.id===sl.id) : null;
    row.innerHTML = `<span class="orbit-slot-n">SLOT ${i+1}</span>` +
      (act
        ? `<span class="orbit-slot-val">${act.icon} ${act.label}</span><span class="orbit-slot-change">change ›</span>`
        : `<span class="orbit-slot-empty">+ tap to set</span>`);
    row.onclick = () => openOrbSheet(i);
    wrap.appendChild(row);
  });
}

function openOrbSheet(idx) {
  activeSlot = idx;
  document.getElementById("orb-sheet-title").textContent = `SELECT ACTION FOR SLOT ${idx+1}`;
  const list = document.getElementById("orb-sheet-list");
  list.innerHTML = "";
  for (const act of ORBIT_ACTIONS) {
    const tile = document.createElement("div");
    tile.className = "orbit-tile";
    const disabled = act.id==="repair" && !getHarvester();
    tile.style.opacity = disabled ? "0.25" : "1";
    tile.style.pointerEvents = disabled ? "none" : "";
    tile.innerHTML = `<span class="ctx-icon">${act.icon}</span><div><div class="ctx-label">${act.label}</div><div class="ctx-desc">${act.desc}</div></div>`;
    tile.onclick = () => { orbitSlots[activeSlot]=act; closeOrbSheet(); renderOrbitSlots(); };
    list.appendChild(tile);
  }
  document.getElementById("orb-bd").hidden = false;
  document.getElementById("orbit-sheet").classList.add("open");
}
function closeOrbSheet() {
  document.getElementById("orb-bd").hidden = true;
  document.getElementById("orbit-sheet").classList.remove("open");
}

async function transmitOrbit() {
  const btn = document.getElementById("transmit-orbit");
  btn.disabled = true;
  const actions = orbitSlots.filter(Boolean).map(act => {
    if (act.wire) return act.wire;
    if (act.id==="repair") { const h=getHarvester(); return h?{a:"repair",unit:h.id}:null; }
    return null;
  }).filter(Boolean);
  if (!actions.length) { btn.disabled=false; alert("Select at least one orbit action."); return; }
  try {
    const r = await api("POST",`/api/game/${SESSION}/orbit`,{player:MY_SEAT,actions});
    if (!r.ok) { alert(`Rejected: ${(r.errors||[]).join("; ")||"unknown"}`); btn.disabled=false; return; }
    orbitSlots=[null,null,null];
    setView("view-waiting");
    updateWaitFromResp(r.phase, r.pending_orbit||{});
    startSync();
  } catch(e) { alert(`Transmit failed: ${e.message}`); btn.disabled=false; }
}

// ── Pull view + update UI ──────────────────────────────────────────
async function pullView() {
  const data = await api("GET",`/api/game/${SESSION}/view?player=${MY_SEAT}`);
  viewData = data; livePhase = data.phase;
  const isOrbit = data.phase === "orbit";
  // Map is only relevant during night phase
  document.querySelector(".map-wrap").hidden = isOrbit;
  document.getElementById("util-night").hidden = isOrbit;
  document.getElementById("tray-night").hidden  = isOrbit;
  document.getElementById("tray-orbit").hidden  = !isOrbit;
  if (!isOrbit) renderMap(data);
  updateStrip(data);
  if (isOrbit) renderOrbitSlots();
}

function updateStrip(data) {
  const ph = data.phase||"";
  document.getElementById("phase-badge").textContent =
    ph==="orbit"?"ORBIT": ph==="season_complete"?"DONE":"NOX";
  document.getElementById("day-lbl").textContent =
    `DAY ${data.day||1}${data.season_day_cap?"/"+data.season_day_cap:""}`;
  const score = data.scores?.[MY_SEAT]??data.score??0;
  document.getElementById("score-lbl").textContent = `${Math.round(score)} pts`;
  const dotsEl = document.getElementById("pdots"), pending=data.pending||{};
  dotsEl.innerHTML = "";
  for (const s of (data.players||[])) {
    const d=document.createElement("div");
    d.className = "pdot " + (s===MY_SEAT?"mine": pending[s]?"theirs":"done");
    d.title = s + (pending[s]?" (waiting)":" (submitted)");
    dotsEl.appendChild(d);
  }
}

// ── Waiting ────────────────────────────────────────────────────────
function updateWait(st) {
  const wb = document.getElementById("wait-badge");
  wb.textContent = `${MY_SEAT.toUpperCase()} · ${SLABEL}`;
  wb.style.borderColor = wb.style.color = ACCENT;
  const others = Object.entries(st.pending||{}).filter(([s,v])=>s!==MY_SEAT&&v).length;
  document.getElementById("wait-lbl").innerHTML =
    others>0 ? `Waiting for ${others} opponent${others>1?"s":""}<span class="ellipsis"></span>`
             : `Resolving<span class="ellipsis"></span>`;
}
function updateWaitFromResp(phase, pending) {
  const wb = document.getElementById("wait-badge");
  wb.textContent = `${MY_SEAT.toUpperCase()} · ${SLABEL}`;
  wb.style.borderColor = wb.style.color = ACCENT;
  const others = Object.entries(pending).filter(([s,v])=>s!==MY_SEAT&&v).length;
  document.getElementById("wait-lbl").innerHTML =
    others>0 ? `Waiting for ${others} opponent${others>1?"s":""}<span class="ellipsis"></span>`
             : `Resolving<span class="ellipsis"></span>`;
}

// ── Sync ───────────────────────────────────────────────────────────
function startSync() { stopSync(); syncTimer=setInterval(poll,2500); }
function stopSync()  { if(syncTimer){clearInterval(syncTimer);syncTimer=null;} }

async function poll() {
  try {
    const st = await api("GET",`/api/game/${SESSION}/status`);
    const sig = `${st.phase}|${st.day}|${JSON.stringify(st.pending)}`;
    if (sig===lastSig) return;
    lastSig = sig;

    if (st.phase==="season_complete"||st.phase==="game_over"||st.phase==="ended") {
      stopSync(); await pullView(); setView("view-game");
      document.getElementById("transmit-night").disabled=true;
      document.getElementById("transmit-orbit").disabled=true;
      return;
    }
    const myPending = (st.pending||{})[MY_SEAT];
    const cur = ["view-join","view-game","view-waiting","view-report"]
      .find(v=>!document.getElementById(v).hidden);
    if (cur==="view-waiting") {
      updateWait(st);
      if (!myPending) {
        const prevPhase = livePhase;
        const log = st.log_tail || [];
        await pullView();
        nightQueue=[]; orbitSlots=[null,null,null]; cancelPick(); renderQueue(); drawOverlays();
        document.getElementById("transmit-night").disabled=false;
        document.getElementById("transmit-orbit").disabled=false;
        // Show briefing before entering the next phase
        if (livePhase==="orbit") {
          showReport(`NOX ${st.day} RESOLVED`, `tap a cell to queue orbit actions`, log);
        } else {
          showReport(`ORBIT ${st.day} RESOLVED`, `tap cells to plan your Nox moves`, log);
        }
      }
    } else if ((cur==="view-game"||cur==="view-report") && st.phase!==livePhase) {
      await pullView();
      nightQueue=[]; orbitSlots=[null,null,null]; cancelPick(); renderQueue(); drawOverlays();
      document.getElementById("transmit-night").disabled=false;
      document.getElementById("transmit-orbit").disabled=false;
    }
  } catch(_) {}
}
