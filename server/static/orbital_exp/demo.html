<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>STATION BIT</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #000;
  color: #888;
  font-family: "Courier New", Courier, monospace;
  font-size: 14px;
  line-height: 1.0;
  overflow: hidden;
}

#station {
  position: absolute;
  left: -8px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

#diamond-wrap {
  position: relative;
  overflow: visible;
}

#diamond {
  color: #ffff00;
  font-size: 18px;
  line-height: 0.6;
  white-space: pre;
  letter-spacing: 0;
  display: block;
  overflow: visible;
}

#bit-tag {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font: bold 14px/1 "Courier New", monospace;
  color: #000;
  letter-spacing: 0.2em;
  pointer-events: none;
  white-space: nowrap;
}

#score {
  font: 15px/1 "Courier New", monospace;
  letter-spacing: 0.15em;
  padding: 2px 5px;
}

#score .z { color: #2a2a00; font-weight: normal; }  /* leading zeros */
#score .n { color: #ffff00; font-weight: bold; }    /* actual digits */

#score.lead          { background: #ffff00; }
#score.lead .z       { color: #888800; font-weight: normal; }
#score.lead .n       { color: #000;    font-weight: bold; }

#btns {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 140px;
}

button {
  font: 9px/1.5 "Courier New", monospace;
  background: transparent;
  border: 1px solid #222;
  color: #555;
  padding: 3px 5px;
  cursor: pointer;
  text-align: left;
  letter-spacing: 0.04em;
  width: 100%;
}

button:hover { border-color: #555; color: #aaa; }
button:active { color: #ffff00; border-color: #888; }

canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
}

#map-sim {
  position: fixed;
  left: 220px;
  right: 20px;
  top: 8%;
  bottom: 8%;
  border: 1px solid #111827;
  background: #03030a;
  z-index: 1;
}

#map-sim::before {
  content: 'MAP';
  position: absolute;
  top: 6px;
  left: 50%;
  transform: translateX(-50%);
  font: 9px/1 "Courier New", monospace;
  color: #111827;
  letter-spacing: 0.2em;
}
</style>
</head>
<body>

<div id="station">
  <div id="diamond-wrap">
    <pre id="diamond"></pre>
    <span id="bit-tag">BIT</span>
  </div>
  <div id="score">00000</div>
  <div id="btns">
    <button onclick="go('probe')">· probe</button>
    <button onclick="go('drop')">▲ orblift drop</button>
    <button onclick="go('rtn_empty')">△ return empty</button>
    <button onclick="go('rtn_damaged')">▲ return damaged</button>
    <button onclick="go('rtn_emped_empty')">△ return emped no cargo</button>
    <button onclick="go('rtn_emped_cargo')">▲ return emped w/ cargo</button>
    <button onclick="randomizeVault()" style="margin-top:6px;border-color:#333">⬡ randomize vault</button>
    <button onclick="clearVault()">⬡ clear vault</button>
  </div>
</div>

<div id="map-sim"></div>
<canvas id="c"></canvas>

<script>
// ── diamond ───────────────────────────────────────────────────────
// Full solid diamond of █ chars.
// A rectangular vault block of ░ sits over the top-left corner,
// extending BEYOND the diamond's diagonal edge into blank space.
//
//  ░░░░░░  ██       ← vault sticks out left of diamond tip
//  ░░░░░░████
//  ░░░░░░████
//  ░░░░░░████
//  ██████████       ← widest row, all diamond
//    ████████
//      ██████
//        ████
//          ██

const HALF       = 5;
const SIZE       = HALF * 2 - 1;  // 9
const VAULT_ROWS = 4;
const VAULT_COLS = 4;
const VAULT_CELLS = VAULT_ROWS * VAULT_COLS;  // 16 (user asked ~15, close enough)

const DENSITY_CHAR = ['░', '▒', '▓', '█'];
const VAULT_COLORS = { red: '#ff4444', blue: '#4488ff', green: '#44cc44' };

let vaultData = Array(VAULT_CELLS).fill(null);  // null = empty

function rebuildDiamond() {
  let html = '';
  let vi = 0;
  for (let r = 0; r < SIZE; r++) {
    const dist     = Math.abs(r - (HALF - 1));
    const diaStart = dist;
    const diaEnd   = SIZE - 1 - dist;
    for (let c = 0; c < SIZE; c++) {
      const inVault   = r < VAULT_ROWS && c < VAULT_COLS;
      const inDiamond = c >= diaStart && c <= diaEnd;
      if (inVault) {
        const cell = vaultData[vi++];
        if (cell) {
          const ch  = cell.type === 'green' ? '█' : DENSITY_CHAR[cell.density - 1];
          html += `<span style="color:${VAULT_COLORS[cell.type]}">${ch}</span>`;
        } else {
          html += '<span style="color:#1a1a00">░</span>';
        }
      } else if (inDiamond) {
        html += '█';
      } else {
        html += ' ';
      }
    }
    if (r < SIZE - 1) html += '\n';
  }
  document.getElementById('diamond').innerHTML = html;
}

function randomizeVault() {
  const types = ['red', 'red', 'blue', 'blue', 'green'];
  vaultData = Array.from({ length: VAULT_CELLS }, () => {
    if (Math.random() < 0.25) return null;
    const type    = types[Math.floor(Math.random() * types.length)];
    const density = Math.ceil(Math.random() * 4);
    return { type, density };
  });
  rebuildDiamond();
}

function clearVault() {
  vaultData = Array(VAULT_CELLS).fill(null);
  rebuildDiamond();
}

rebuildDiamond();

// ── score ─────────────────────────────────────────────────────────
const scoreEl   = document.getElementById('score');
let   displayed = 0;   // what's currently shown (animating)
let   target    = 0;   // what we're counting toward
let   tweenRaf  = null;
const IS_LEAD   = true;  // single-station demo always leads

function renderScore(n) {
  const s = String(n % 100000).padStart(5, '0');
  let   firstNonZero = s.length;
  for (let i = 0; i < s.length; i++) { if (s[i] !== '0') { firstNonZero = i; break; } }
  scoreEl.innerHTML = [...s].map((d, i) =>
    `<span class="${i < firstNonZero ? 'z' : 'n'}">${d}</span>`
  ).join('');
  scoreEl.classList.toggle('lead', IS_LEAD);
}

function tweenStep() {
  if (displayed >= target) { tweenRaf = null; return; }
  const diff = target - displayed;
  displayed += Math.max(1, Math.ceil(diff * 0.18));
  if (displayed > target) displayed = target;
  renderScore(displayed);
  tweenRaf = requestAnimationFrame(tweenStep);
}

function tick() {
  target += Math.floor(Math.random() * 546);
  if (!tweenRaf) tweenRaf = requestAnimationFrame(tweenStep);
  setTimeout(tick, 500 + Math.random() * 900);
}
renderScore(0);
tick();

// ── canvas ────────────────────────────────────────────────────────
const cvs   = document.getElementById('c');
const ctx   = cvs.getContext('2d');
const anims = [];
let   raf   = null;
let   slot  = 0;

function resize() { cvs.width = innerWidth; cvs.height = innerHeight; }
resize();
window.addEventListener('resize', resize);

function ease(raw, kind) {
  if (kind === 'in')    return raw * raw;
  if (kind === 'out')   return 1 - (1 - raw) * (1 - raw);
  if (kind === 'inout') return raw * raw * (3 - 2 * raw);
  return raw;
}

function frame(now) {
  ctx.clearRect(0, 0, cvs.width, cvs.height);

  // Clip out the station diamond so glyphs don't render over it
  const dr = document.getElementById('diamond').getBoundingClientRect();
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, cvs.width, cvs.height);
  ctx.rect(dr.left - 2, dr.top - 2, dr.width + 4, dr.height + 4);
  ctx.clip('evenodd');

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const live = [];
  for (const a of anims) {
    const raw = Math.min((now - a.t0) / a.dur, 1);
    const t   = ease(raw, a.ease);
    const x   = a.x0 + (a.x1 - a.x0) * t;
    const y   = a.y0 + (a.y1 - a.y0) * t;

    // Directional trail — unit vector opposite to travel direction
    const dx  = a.x1 - a.x0, dy = a.y1 - a.y0;
    const len = Math.sqrt(dx*dx + dy*dy) || 1;
    const ux  = -dx / len, uy = -dy / len;

    ctx.font = `${a.trailSize}px 'Courier New',monospace`;
    for (let d = 1; d <= a.trailLen; d++) {
      const xd = x + ux * d * a.trailGap;
      const yd = y + uy * d * a.trailGap;
      ctx.globalAlpha = Math.max(0, a.trailAlpha - d * 0.06);
      ctx.fillStyle = a.col;
      ctx.fillText('·', xd, yd);
    }

    ctx.font = `${a.size}px 'Courier New',monospace`;
    ctx.globalAlpha = raw > 0.95 ? 1 - (raw - 0.95) * 20 : 1;
    ctx.fillStyle = a.col;
    ctx.fillText(a.gl, x, y);
    ctx.globalAlpha = 1;

    if (raw < 1) live.push(a);
  }

  ctx.restore();
  anims.length = 0; anims.push(...live);
  if (anims.length > 0) {
    raf = requestAnimationFrame(frame);
  } else {
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    raf = null;
  }
}

function push(gl, col, inbound, opts) {
  const dr    = document.getElementById('diamond').getBoundingClientRect();
  const mr    = document.getElementById('map-sim').getBoundingClientRect();
  const stX   = dr.right;                       // launch/arrive at right edge of diamond
  const mapX  = inbound ? mr.left + 8 : mr.left - 8;
  const cy    = dr.top + dr.height * 0.5;
  const yOff  = opts.yOffset ?? 0;
  // outbound: start at station centre-y, arrive at map with yOffset
  // inbound:  start at map with yOffset, arrive back at station centre-y
  anims.push({
    gl, col,
    x0: inbound ? mapX : stX,
    x1: inbound ? stX  : mapX,
    y0: inbound ? cy + yOff : cy,
    y1: inbound ? cy        : cy + yOff,
    dur:        opts.dur        ?? 600,
    size:       opts.size       ?? 11,
    trailSize:  opts.trailSize  ?? 9,
    trailLen:   opts.trailLen   ?? 3,
    trailGap:   opts.trailGap   ?? 8,
    trailAlpha: opts.trailAlpha ?? 0.22,
    ease:       opts.ease       ?? 'inout',
    t0: performance.now()
  });
  if (!raf) raf = requestAnimationFrame(frame);
}

const ORBLIFT = { dur: 3400, size: 18, trailLen: 3, trailGap: 12, trailAlpha: 0.20 };

function go(kind) {
  if (kind === 'probe') {
    const yOffset = (Math.random() - 0.5) * 90;  // random angle each launch
    push('■', '#ffff00', false, { dur: 2200, size: 7, trailSize: 6, trailLen: 2, trailGap: 6, trailAlpha: 0.12, ease: 'in', yOffset });
  }
  if (kind === 'drop')
    push('▲', '#ffff00', false, { ...ORBLIFT, ease: 'in',  yOffset:  30 });
  if (kind === 'rtn_empty')
    push('△', '#ffff00', true,  { ...ORBLIFT, ease: 'out', yOffset:  30 });
  if (kind === 'rtn_damaged')
    push('▲', '#ff3333', true,  { ...ORBLIFT, ease: 'out', yOffset:  55 });
  if (kind === 'rtn_emped_empty')
    push('△', '#00ffff', true,  { ...ORBLIFT, ease: 'out', yOffset: -20 });
  if (kind === 'rtn_emped_cargo')
    push('▲', '#00ffff', true,  { ...ORBLIFT, ease: 'out', yOffset: -20 });
}
</script>
</body>
</html>
